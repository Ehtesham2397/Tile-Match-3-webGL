<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Tile Match 3 Sort Puzzle Game</title>
  <link rel="icon" type="image/png" sizes="64x64" href="TemplateData/favicon.png">
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
  <style>
    :root {
      --bg1: #3a1c71; --bg2: #d76d77; --bg3: #ffaf7b;
      --bar-bg: rgba(255,255,255,.25); --bar: #ffd84d; --text: #fff;
    }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1035; }
    #unity-container { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1b1035; }

    /* ---------- Loader ---------- */
    #loader {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      background-size: 300% 300%;
      animation: bgShift 8s ease infinite;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; color: var(--text);
      transition: opacity .6s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    @keyframes bgShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

    /* floating background tiles */
    .bg-tile {
      position: absolute; bottom: -80px; width: 46px; height: 46px; opacity: .35;
      background-size: contain; background-repeat: no-repeat; animation: floatUp linear infinite;
    }
    @keyframes floatUp { to { transform: translateY(-120vh) rotate(360deg); } }

    /* title */
    .title {
      font-size: clamp(30px, 8vw, 58px); font-weight: 900; letter-spacing: 2px;
      text-shadow: 0 4px 0 #8a2f5a, 0 8px 18px rgba(0,0,0,.35);
      animation: bob 2.4s ease-in-out infinite; margin-bottom: 28px; text-align: center;
    }
    .title span { display: inline-block; animation: wave 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    @keyframes wave { 0%,100%{transform:translateY(0)} 30%{transform:translateY(-10px)} }

    /* matching tiles row */
    .tiles { display: flex; gap: 12px; margin-bottom: 36px; }
    .tile {
      width: 72px; height: 72px; border-radius: 14px;
      background-size: contain; background-repeat: no-repeat; background-position: center;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.3));
      transform: scale(0); opacity: 0; /* animated from JS (Web Animations API) */
    }

    /* progress */
    .bar-wrap {
      width: min(70vw, 340px); height: 22px; border-radius: 12px; padding: 4px;
      background: var(--bar-bg); box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
    }
    .bar {
      height: 100%; width: 0%; border-radius: 9px;
      background: repeating-linear-gradient(45deg, #ffd84d 0 12px, #ffc21a 12px 24px);
      background-size: 34px 34px; animation: stripes .8s linear infinite;
      transition: width .25s ease;
    }
    @keyframes stripes { to { background-position: 34px 0; } }
    .pct { margin-top: 12px; font-size: 18px; font-weight: 700; }
    .tip { margin-top: 6px; font-size: 14px; opacity: .85; min-height: 18px; transition: opacity .4s; }

    #warning {
      position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 20;
      background: #fff; color: #222; padding: 10px 16px; border-radius: 8px; display: none;
      font-family: Arial, sans-serif; font-size: 14px; max-width: 90vw;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loader">
    <div class="title" id="title"></div>
    <div class="tiles">
      <div class="tile"></div><div class="tile"></div><div class="tile"></div>
    </div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="pct" id="pct">0%</div>
    <div class="tip" id="tip">Loading...</div>
  </div>
  <div id="warning"></div>

  <script>
    // Wavy title letters
    (function () {
      var t = "TILE MATCH", el = document.getElementById("title");
      for (var i = 0; i < t.length; i++) {
        var s = document.createElement("span");
        s.textContent = t[i] === " " ? " " : t[i];
        s.style.animationDelay = (i * 0.08) + "s";
        el.appendChild(s);
      }
      // Tile images (TemplateData/tiles/t_1..t_20.png)
      function tileUrl(n) { return "url('TemplateData/tiles/t_" + n + ".png')"; }
      function randTile() { return 1 + Math.floor(Math.random() * 20); }
      for (var p = 1; p <= 20; p++) { var im = new Image(); im.src = "TemplateData/tiles/t_" + p + ".png"; }

      // Matching row: 3 same tiles, new fruit every match cycle (when hidden)
      var rowTiles = document.querySelectorAll(".tiles .tile"), cur = 1;
      function setRow() { for (var r = 0; r < rowTiles.length; r++) rowTiles[r].style.backgroundImage = tileUrl(cur); }
      setRow();
      // One round = appear -> bounce -> match glow -> fade out.
      // The sprite changes only after ALL tiles have finished and are invisible.
      var glow = "drop-shadow(0 0 12px #ffd84d) drop-shadow(0 0 4px #fff)";
      var base = "drop-shadow(0 8px 10px rgba(0,0,0,.3))";
      function playTile(el, delay) {
        return el.animate([
          { transform: "translateY(0) scale(0)",     opacity: 0, filter: base, offset: 0 },
          { transform: "translateY(0) scale(1)",     opacity: 1, filter: base, offset: 0.14 },
          { transform: "translateY(-22px) scale(1.08)", opacity: 1, filter: base, offset: 0.30 },
          { transform: "translateY(0) scale(1)",     opacity: 1, filter: base, offset: 0.46 },
          { transform: "translateY(0) scale(1)",     opacity: 1, filter: base, offset: 0.58 },
          { transform: "translateY(0) scale(1.18)",  opacity: 1, filter: glow, offset: 0.72 },
          { transform: "translateY(0) scale(1.05)",  opacity: 0.6, filter: glow, offset: 0.86 },
          { transform: "translateY(0) scale(0.6)",   opacity: 0, filter: glow, offset: 1 }
        ], { duration: 2600, delay: delay, easing: "ease-in-out", fill: "both" }).finished;
      }
      function round() {
        setRow(); // all tiles are invisible here (fill: both keeps the last frame: opacity 0)
        var runs = [];
        for (var r = 0; r < rowTiles.length; r++) runs.push(playTile(rowTiles[r], r * 180));
        Promise.all(runs).then(function () {
          cur = cur % 20 + 1;
          setTimeout(round, 250); // short pause while empty
        });
      }
      round();

      // Floating background tiles
      var loader = document.getElementById("loader");
      for (var j = 0; j < 14; j++) {
        var b = document.createElement("div");
        b.className = "bg-tile";
        b.style.backgroundImage = tileUrl(randTile());
        b.style.left = (Math.random() * 100) + "vw";
        var size = 24 + Math.random() * 40;
        b.style.width = b.style.height = size + "px";
        b.style.animationDuration = (7 + Math.random() * 8) + "s";
        b.style.animationDelay = (-Math.random() * 10) + "s";
        loader.appendChild(b);
      }
      // Rotating tips
      var tips = ["Match 3 same tiles to clear them!", "Use boosters when you get stuck", "Plan ahead — the tray fills fast!", "Clear the board to win"];
      var k = 0, tip = document.getElementById("tip");
      setInterval(function () {
        tip.style.opacity = 0;
        setTimeout(function () { tip.textContent = tips[k++ % tips.length]; tip.style.opacity = .85; }, 400);
      }, 2600);
    })();

    var canvas = document.querySelector("#unity-canvas");
    var bar = document.getElementById("bar");
    var pct = document.getElementById("pct");

    function unityShowBanner(msg, type) {
      var w = document.getElementById("warning");
      w.textContent = msg; w.style.display = "block";
      if (type === "error") w.style.background = "#ffd6d6";
      else setTimeout(function () { w.style.display = "none"; }, 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Apex Theory Game",
      productName: "Tile Match 3 Sort Puzzle Game",
      productVersion: "1.0.1",
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var p = Math.round(progress * 100);
        bar.style.width = p + "%";
        pct.textContent = p + "%";
      }).then(function (unityInstance) {
        bar.style.width = "100%"; pct.textContent = "100%";
        var l = document.getElementById("loader");
        l.classList.add("hide");
        setTimeout(function () { l.remove(); }, 700);
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
